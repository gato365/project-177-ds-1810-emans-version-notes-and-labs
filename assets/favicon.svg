<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- STAT/DATA 1810 · weekly exploration: bars = data, compass needle = exploring -->
  <rect width="64" height="64" rx="14" fill="#1f5f8b"/>
  <!-- bars -->
  <rect x="11" y="38" width="8" height="15" rx="2" fill="#ffffff" opacity="0.55"/>
  <rect x="23" y="30" width="8" height="23" rx="2" fill="#ffffff" opacity="0.75"/>
  <rect x="35" y="22" width="8" height="31" rx="2" fill="#ffffff" opacity="0.9"/>
  <!-- compass ring -->
  <circle cx="45" cy="19" r="11.5" fill="#1f5f8b" stroke="#e8a33d" stroke-width="3"/>
  <!-- needle -->
  <polygon points="45,9.5 48.5,19 45,28.5 41.5,19" fill="#e8a33d"/>
  <polygon points="45,9.5 48.5,19 45,19" fill="#ffffff" opacity="0.85"/>
  <circle cx="45" cy="19" r="1.8" fill="#1f5f8b"/>
</svg>
