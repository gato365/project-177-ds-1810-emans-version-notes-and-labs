<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Source Sans 3, Helvetica Neue, Arial, sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f5f8b">Every step up the ladder is ×1,000</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6470"/></marker></defs>
  <!-- boxes: 160 wide, 56 tall; x step 190, y step -62 -->
  <g font-size="15">
    <g transform="translate(30,330)">
      <rect width="160" height="56" rx="8" fill="#eef5fb" stroke="#1f5f8b" stroke-width="2"/>
      <text x="80" y="23" text-anchor="middle" font-weight="700" fill="#1f5f8b">byte (B)</text>
      <text x="80" y="44" text-anchor="middle" font-size="12" fill="#232629">one letter: "a"</text>
    </g>
    <g transform="translate(220,268)">
      <rect width="160" height="56" rx="8" fill="#e6f4f4" stroke="#0f8b8d" stroke-width="2"/>
      <text x="80" y="23" text-anchor="middle" font-weight="700" fill="#0f8b8d">kilobyte (KB)</text>
      <text x="80" y="44" text-anchor="middle" font-size="12" fill="#232629">a long paragraph</text>
    </g>
    <g transform="translate(410,206)">
      <rect width="160" height="56" rx="8" fill="#e8f5ee" stroke="#2e8b57" stroke-width="2"/>
      <text x="80" y="23" text-anchor="middle" font-weight="700" fill="#2e8b57">megabyte (MB)</text>
      <text x="80" y="44" text-anchor="middle" font-size="12" fill="#232629">one phone photo (3 MB)</text>
    </g>
    <g transform="translate(600,144)">
      <rect width="160" height="56" rx="8" fill="#fff4e3" stroke="#e8a33d" stroke-width="2"/>
      <text x="80" y="23" text-anchor="middle" font-weight="700" fill="#b7770f">gigabyte (GB)</text>
      <text x="80" y="44" text-anchor="middle" font-size="12" fill="#232629">1 hr of HD Netflix (3 GB)</text>
    </g>
    <g transform="translate(790,82)">
      <rect width="160" height="56" rx="8" fill="#f9e9e7" stroke="#c0392b" stroke-width="2"/>
      <text x="80" y="23" text-anchor="middle" font-weight="700" fill="#c0392b">terabyte (TB)</text>
      <text x="80" y="44" text-anchor="middle" font-size="12" fill="#232629">two whole laptops</text>
    </g>
    <!-- arrows from top-right corner of one box to bottom-left of the next -->
    <g stroke="#5b6470" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M195 330 L 215 324"/>
      <path d="M385 268 L 405 262"/>
      <path d="M575 206 L 595 200"/>
      <path d="M765 144 L 785 138"/>
    </g>
    <!-- ×1,000 labels sit ABOVE each arrow, clear of the boxes -->
    <g font-size="13" font-weight="700" fill="#5b6470" text-anchor="middle">
      <text x="205" y="312">×1,000</text>
      <text x="395" y="250">×1,000</text>
      <text x="585" y="188">×1,000</text>
      <text x="775" y="126">×1,000</text>
    </g>
  </g>
  <text x="480" y="412" text-anchor="middle" font-size="13" fill="#5b6470">1 TB = 1,000 GB = 1,000,000 MB = 1,000,000,000 KB = 1,000,000,000,000 bytes</text>
</svg>
